# The two services on one private network: FastAPI (the engine) and Next.js
# (the wizard).
#
#   docker compose up --build          # http://localhost:3000/es/student
#   docker compose down
#
# Only the web service publishes a port. The Python service is reachable at
# http://api:8000 from inside the network and nowhere else: the browser always
# talks to the Next.js proxy on the same origin, which is what keeps the
# RUN/IPE first-party and makes CORS unnecessary.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # One container = one uvicorn worker; see the CMD comment in Dockerfile.api
    # (Nominatim is throttled per process, and so is the per-IP geocode limit).
    # Do not scale this service without shared throttling.
    restart: unless-stopped
    expose:
      - "8000"
    # No environment: SAE_CORS_ORIGINS stays unset because nothing calls this
    # service cross-origin, and SAE_TRUSTED_PROXIES stays unset because the
    # peer here is the web container rather than the loopback address it would
    # have to name. The consequence is deliberate: api.py ignores the
    # X-Forwarded-For the frontend sends, so the per-IP geocode budget becomes
    # one bucket for the whole frontend — stricter than per browser, never
    # looser, and impossible to widen with a forged header. Name a real front
    # proxy in both variables only once one terminates the traffic.
    healthcheck:
      # python instead of curl: the slim image ships no curl, and adding one
      # only for the probe would enlarge the runtime surface.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Reading and validating the four calibration CSVs happens in the FastAPI
      # lifespan, before the first response; give it room on a cold start.
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side only: read by the Next.js route handler, never shipped to
      # the browser (no NEXT_PUBLIC_ twin on purpose).
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # TRUST_PROXY is deliberately absent. Here Next.js is the outermost hop,
      # so an incoming X-Forwarded-For is pure client input; believing it would
      # let one caller mint a fresh rate-limit bucket per request. Set
      # TRUST_PROXY=1 only behind a reverse proxy you control that always
      # rewrites the header (web/lib/api/proxy.ts, web/.env.example).
    depends_on:
      api:
        # The wizard fetches /meta on every route, so starting before the CSVs
        # are validated would surface an error page instead of step 1.
        condition: service_healthy
